name: grok2api

services:
  grok2api:
    container_name: grok2api
    image: "${GROK2API_IMAGE:-ghcr.io/chenyme/grok2api:v3.1.0}"
    ports:
      - "${GROK2API_PORT:-8000}:8000"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 非空时覆盖 config.yaml 的 PostgreSQL DSN，并自动启用 postgres。
      GROK2API_DATABASE_URL: "${GROK2API_DATABASE_URL:-}"
      GROK2API_QUALITY_GUARD_DIR: /var/lib/grok2api-quality-guard
    volumes:
      - "${GROK2API_CONFIG:-./config.yaml}:/run/grok2api/config.yaml:ro"
      - grok2api-data:/app/data
      - quality_guard_state:/var/lib/grok2api-quality-guard
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - grok2api_upstream
      - ai_gateway

  # ================================ WARP ================================
  # 如果出口 IP 不干净，可取消以下注释使用 WARP 作为落地代理。
  # 启用后，在管理端“设置 -> 出口代理”中新增 socks5://warp:1080。

  # warp:
  #   container_name: warp
  #   image: caomingjun/warp:latest
  #   profiles: ["warp"]
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:1080:1080"
  #   environment:
  #     - WARP_SLEEP=2
  #   cap_add:
  #     - NET_ADMIN

  # ================================ FLARESOLVERR ================================
  # 在管理端将 Clearance 模式设为 FlareSolverr，并使用 http://flaresolverr:8191。
  # 启动命令：docker compose --profile flaresolverr up -d
  # Podman：podman compose --profile flaresolverr up -d

  # flaresolverr:
  #   container_name: flaresolverr
  #   image: ghcr.io/flaresolverr/flaresolverr:latest
  #   profiles: ["flaresolverr"]
  #   environment:
  #     TZ: Asia/Shanghai
  #     LOG_LEVEL: info
  #   restart: unless-stopped

  # ================================ EGRESS QUALITY GUARD ================================
  # 可选的 Grok Build 出口质量守护 sidecar。默认不启动，也不会产生探测请求。
  # 启用前在 config.yaml 中配置 qualityGuard，然后执行：
  # docker compose --profile quality-guard up -d --build

  egress-quality-guard:
    container_name: grok2api-egress-quality-guard
    profiles: ["quality-guard"]
    build:
      context: .
      dockerfile: tools/egress-quality-guard/Dockerfile
    depends_on:
      grok2api:
        condition: service_healthy
    volumes:
      - quality_guard_state:/var/lib/grok2api-quality-guard
    restart: "on-failure:5"
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  # Dedicated Mihomo instance for Grok Build. It reuses the subscription
  # configuration but maintains its own runtime selector and never changes
  # the shared Mihomo instance used by the other applications.
  mihomo-grok:
    container_name: mihomo-grok
    image: docker.io/metacubex/mihomo:latest
    command: ["-d", "/root/.config/mihomo"]
    volumes:
      - /home/ubuntu/apps/server/mihomo/config.yaml:/root/.config/mihomo/config.yaml:ro
      - mihomo_grok_runtime:/root/.config/mihomo
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  # Observes the official quality guard state and rotates only the dedicated
  # Mihomo selector after confirmed anomalies. It has no access to the shared
  # Mihomo instance and cannot disable the Grok2API egress node.
  mihomo-grok-rotator:
    container_name: mihomo-grok-rotator
    build:
      context: .
      dockerfile: tools/mihomo-grok-rotator/Dockerfile
    depends_on:
      mihomo-grok:
        condition: service_started
      egress-quality-guard:
        condition: service_started
    environment:
      MIHOMO_CONTROLLER: http://mihomo-grok:9090
      MIHOMO_CONFIG_FILE: /etc/mihomo/config.yaml
      # Grok Build's cli-chat-proxy.grok.com rule resolves to this selector.
      MIHOMO_SELECTOR: "🐟 漏网之鱼"
      MIHOMO_TARGET_URL: https://cli-chat-proxy.grok.com
      QUALITY_GUARD_STATE_FILE: /var/lib/grok2api-quality-guard/state.json
      ROTATOR_STATE_FILE: /var/lib/mihomo-grok-rotator/state.json
      ROTATOR_POLL_SECONDS: "15"
      ROTATOR_HARD_REQUIRED: "2"
      ROTATOR_SOFT_REQUIRED: "2"
      ROTATOR_ERROR_REQUIRED: "2"
      ROTATOR_GLOBAL_COOLDOWN_SECONDS: "900"
      ROTATOR_NODE_COOLDOWN_SECONDS: "3600"
      ROTATOR_MAX_CANDIDATES: "8"
    volumes:
      - /home/ubuntu/apps/server/mihomo/config.yaml:/etc/mihomo/config.yaml:ro
      - quality_guard_state:/var/lib/grok2api-quality-guard:ro
      - mihomo_grok_rotator_state:/var/lib/mihomo-grok-rotator
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  grok2api-data:
  quality_guard_state:
  mihomo_grok_runtime:
  mihomo_grok_rotator_state:

networks:
  ai_gateway:
    name: ai-gateway-network
    external: true
  grok2api_upstream:
    name: grok2api-upstream-network
    external: true
